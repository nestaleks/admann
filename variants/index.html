<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admann Variants</title>
  <style>
    :root {
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --line: #e2e8f0;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      width: min(1080px, 92vw);
      margin: 0 auto;
      padding: 32px 0 48px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.15;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    a.card {
      display: block;
      padding: 18px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card-title {
      display: block;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .swatches {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .swatch {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      border: 1px solid rgba(15, 23, 42, .12);
    }
    a.card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(2, 6, 23, .08);
      border-color: #cbd5e1;
    }
  </style>
</head>
<body>
